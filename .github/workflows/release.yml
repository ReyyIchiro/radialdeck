name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v4

      - name: Trust checkout directory for git
        # Container runs as a different UID than the runner that wrote the
        # checkout, so git refuses `describe`/`archive` without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GTK4 + layer-shell build deps
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libglib2.0-dev libpango1.0-dev libcairo2-dev \
            libgdk-pixbuf-2.0-dev wayland-protocols libwayland-dev \
            meson ninja-build valac
          pkg-config --atleast-version=4.16 gtk4
          git clone --depth 1 -b v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup --prefix=/usr -Dintrospection=false -Dvapi=false \
            -Dexamples=false -Ddocs=false -Dtests=false build
          meson install -C build

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ubuntu26-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify version consistency
        run: |
          git describe --tags --abbrev=0 --match 'v*' | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" >/dev/null
          grep -Eq '^version = ".*"$' Cargo.toml crates/deck-core/Cargo.toml crates/radial-deck/Cargo.toml

      - name: Quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate deterministic release source artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar --prefix="radialdeck-$VERSION/" "$GITHUB_REF_NAME" | gzip -n -9 > "dist/radialdeck-$VERSION.tar.gz"
          sha256sum dist/radialdeck-$VERSION.tar.gz > dist/radialdeck-$VERSION.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RadialDeck ${{ github.ref_name }}
          body: "See CHANGELOG.md for release notes."
          files: |
            dist/radialdeck-*.tar.gz
            dist/radialdeck-*.sha256
            target/release/radial-deck
          draft: false
          prerelease: false

      - name: Publish release asset
        # Upload artifact remains available for consumers who prefer the
        # prebuilt binary alongside the GitHub Release download page.
        uses: actions/upload-artifact@v4
        with:
          name: radial-deck-linux-x86_64
          path: target/release/radial-deck
          retention-days: 30
