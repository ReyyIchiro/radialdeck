[workspace]
members = ["crates/deck-core", "crates/radial-deck"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Raihan <raihan@localhost>"]
repository = "https://github.com/raihan/radial-deck"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
directories = "6.0.0"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
