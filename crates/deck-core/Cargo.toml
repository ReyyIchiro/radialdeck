[package]
name = "deck-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-independent domain logic for RadialDeck"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
directories.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "pnm", "qoi", "tga"] }
# `deflate-zlib` keeps flate2's zlib backend and drops zopfli, which the
# default `deflate` feature adds and which makes every ZIP write ~10x slower.
zip = { version = "2", default-features = false, features = ["deflate-zlib"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"
tempfile.workspace = true
tracing = "0.1.44"
