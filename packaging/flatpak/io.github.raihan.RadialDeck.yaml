app-id: io.github.raihan.RadialDeck
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: radial-deck

finish-args:
  # Wayland display
  - --socket=wayland
  # X11 fallback
  - --socket=fallback-x11
  - --share=ipc
  # Conversions are written next to the source file, so the sandbox needs
  # write access. A narrower portal-based flow is future work.
  - --filesystem=home
  # D-Bus for XDG portal (GlobalShortcuts, OpenURI, FileChooser)
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  # StatusNotifier tray
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  # Autostart (write .config/autostart)
  - --filesystem=xdg-config/autostart:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/radial-deck/cargo
    RUST_BACKTRACE: "1"

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dintrospection=false
      - -Dvapi=false
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 5ef4f06d255174049c3ac4b4d5bdbf5e2f893432

  - name: radial-deck
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/radial-deck /app/bin/radial-deck
      - install -Dm644 packaging/io.github.raihan.RadialDeck.desktop
          /app/share/applications/io.github.raihan.RadialDeck.desktop
      - install -Dm644 packaging/io.github.raihan.RadialDeck.svg
          /app/share/icons/hicolor/scalable/apps/io.github.raihan.RadialDeck.svg
    sources:
      - type: dir
        path: ../..
      # cargo-sources.json generated by flatpak-cargo-generator.py
      # Run: python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - cargo-sources.json
